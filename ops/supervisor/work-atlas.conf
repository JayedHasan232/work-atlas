; Work Atlas long-running processes (PLAN M22): Horizon (queues, every AI call) and the Inertia SSR
; server. Installed by ops/provision.sh as /etc/supervisor/conf.d/work-atlas.conf. A deploy stops
; both gracefully (horizon:terminate, inertia:stop-ssr) and supervisor starts the new release.

[program:work-atlas-horizon]
command=/usr/bin/php /var/www/work-atlas/current/artisan horizon
user=deploy
autostart=true
autorestart=true
stopwaitsecs=3600
stopsignal=TERM
redirect_stderr=true
stdout_logfile=/var/log/work-atlas/horizon.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:work-atlas-ssr]
command=/usr/bin/php /var/www/work-atlas/current/artisan inertia:start-ssr
user=deploy
autostart=true
autorestart=true
stopsignal=TERM
redirect_stderr=true
stdout_logfile=/var/log/work-atlas/ssr.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

# The app itself, shared by the public and the local server blocks.
root /var/www/work-atlas/current/public;
index index.php;
charset utf-8;
client_max_body_size 8m;

# The app sets nosniff, frame, referrer and permissions headers itself (App\Http\Middleware\SecurityHeaders);
# repeating them here would send each twice. TLS is Nginx's, so HSTS is set here.
add_header Strict-Transport-Security "max-age=31536000" always;

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Built assets have hashed names, so they can be cached for a long time (Cloudflare caches only these).
location /build/ {
    expires 1y;
    # An add_header here replaces the ones above for this location, so HSTS is repeated.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

location = /favicon.ico { access_log off; log_not_found off; }

location ~ ^/index\.php(/|$) {
    fastcgi_pass unix:/run/php/php8.4-fpm-work-atlas.sock;
    fastcgi_split_path_info ^(.+\.php)(/.*)$;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    fastcgi_hide_header X-Powered-By;
}

location ~ /\.(?!well-known).* {
    deny all;
}

location ~ \.php$ {
    return 404;
}

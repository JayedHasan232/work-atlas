# Work Atlas (PLAN M22). Installed by ops/provision.sh as /etc/nginx/sites-available/work-atlas.
# __DOMAIN__ is replaced by the provisioning script. Cloudflare sits in front with TLS "Full
# (strict)": the origin certificate comes from Cloudflare's Origin CA (docs/ops/server.md).

# Behind Cloudflare: the visitor's address for rate limits and logs.
include /etc/nginx/snippets/cloudflare-real-ip.conf;

# Any other host name is refused. Without these two blocks the site below would answer every Host
# header sent straight to the server's address, and the app builds links (password reset mail,
# canonical URLs) from that header.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/work-atlas-app.conf;
}

# Local only: the post-deploy smoke check (deploy.php) and the uptime of the box itself.
server {
    listen 127.0.0.1:8080;
    server_name _;

    include /etc/nginx/snippets/work-atlas-app.conf;
}

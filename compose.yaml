# Local services only: PHP and Node run on your machine (docs/PLAN.md, D10).
# Start with `docker compose up -d`. The credentials match .env.example and are for local development only.
services:
    postgres:
        image: postgres:18-alpine
        environment:
            POSTGRES_USER: work_atlas
            POSTGRES_PASSWORD: password
            POSTGRES_DB: work_atlas
        ports:
            - '127.0.0.1:5432:5432'
        volumes:
            # PostgreSQL 18 images keep their data in a versioned folder under /var/lib/postgresql.
            - postgres-data:/var/lib/postgresql
            - ./docker/postgres/create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql:ro
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U work_atlas -d work_atlas']
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:8-alpine
        ports:
            - '127.0.0.1:6379:6379'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    postgres-data:

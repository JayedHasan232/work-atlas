name: CI scripts

on:
  pull_request:
    paths: ["scripts/ci/**", "ops/**", ".github/workflows/ci-scripts.yml"]
  push:
    branches: [main]
    paths: ["scripts/ci/**", "ops/**", ".github/workflows/ci-scripts.yml"]

permissions:
  contents: read

jobs:
  selftest:
    name: CI script self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci/check-dco-selftest
      - run: scripts/ci/check-immutable-selftest
      - name: ShellCheck (CI and server scripts)
        run: shellcheck scripts/ci/check-dco scripts/ci/check-dco-selftest scripts/ci/check-immutable scripts/ci/check-immutable-selftest scripts/ci/ssr-smoke ops/provision.sh ops/backup/*

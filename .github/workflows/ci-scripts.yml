name: CI scripts

on:
  pull_request:
    paths: ["scripts/ci/**", ".github/workflows/ci-scripts.yml"]
  push:
    branches: [main]
    paths: ["scripts/ci/**", ".github/workflows/ci-scripts.yml"]

permissions:
  contents: read

jobs:
  selftest:
    name: check-dco self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci/check-dco-selftest
